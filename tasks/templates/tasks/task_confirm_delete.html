{% extends 'tasks/base.html' %}

{% block content %}
<h2>Delete Task</h2>
<div class="form-card">
    <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button delete">Yes, delete</button>
        <a href="{% url 'dashboard' %}" class="button button-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
